# Local Ollama assistant for HueGallery.
# Every value can be overridden with a system property of the same name or
# with the matching environment variable (noted in comments).

# Base URL of the Ollama HTTP API.
ai.ollama.url=http://127.0.0.1:11434

# Prompt-mode model. qwen2:1.5b has completion only (no tool calling).
ai.model=qwen2:1.5b

# Tool-capable model. Used automatically because qwen2:1.5b cannot call tools.
ai.tool-model=qwen3.5:0.8b

# Prefer the tool-capable model when it is installed.
ai.prefer-tools=true

# Disable the thinking trace for speed. Set true for more deliberate tool choices.
ai.think=false

# The first model load can take a while; keep the request timeout generous.
ai.timeout-seconds=180

# Maximum assistant/tool exchanges per search.
ai.max-tool-rounds=4

# Maximum number of images requested per tool call.
ai.max-results=12
